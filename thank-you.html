<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're on the Waitlist! — Gainwork</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=4" />
  <style>
    .thankyou-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1E2240 0%, #0F1529 100%);
      padding: 2rem;
    }
    .thankyou-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(59,171,130,0.3);
      border-radius: 20px;
      padding: 3.5rem;
      max-width: 560px;
      text-align: center;
    }
    .thankyou-icon { font-size: 3.5rem; margin-bottom: 1.5rem; }
    .thankyou-card h1 {
      font-size: 2rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 1rem;
    }
    .thankyou-card h1 span { color: #52C99D; }
    .thankyou-card p {
      font-size: 1rem;
      color: rgba(255,255,255,0.7);
      line-height: 1.7;
      margin-bottom: 2rem;
    }
    .thankyou-card .btn-primary {
      display: inline-block;
      background: #3BAB82;
      color: #fff;
      padding: 0.85rem 2rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      text-decoration: none;
      transition: background 0.2s;
    }
    .thankyou-card .btn-primary:hover { background: #52C99D; }
  </style>
</head>
<body>
  <div class="thankyou-page">
    <div class="thankyou-card">
      <div class="thankyou-icon">🎉</div>
      <h1>You're on the <span>Waitlist!</span></h1>
      <p>Thank you for signing up. You'll be among the first to know when Gainwork launches — and as a waitlist member, you'll get priority access and a free extended trial.</p>
      <p>Keep an eye on your inbox. We'll be in touch soon.</p>
      <a href="index.html" class="btn-primary">Back to Gainwork →</a>
    </div>
  </div>
</body>
</html>
